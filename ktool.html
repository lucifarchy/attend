<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K문서툴 - 무료 웹 도구 모음</title>
  
  <!-- 아이콘 (Lucide React 대체용 Feather Icons 사용) -->
  <script src="https://unpkg.com/feather-icons"></script>
  
  <style>
    /* --- 원본 사이트 CSS 디자인 적용 (React 버전과 동일) --- */
    :root {
        color-scheme: light;
        --bg: #f7f8fb;
        --surface: #fff;
        --surface-muted: #f4f6fa;
        --paper: #fff;
        --ink: #101828;
        --muted: #667085;
        --line: #d0d5dd;
        --line-dark: #18181b;
        --accent: #155eef;
        --accent-dark: #1248b6;
        --shadow: 0 12px 32px #0f172a12;
        --radius: 8px;
        --font-sans: Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", sans-serif;
        font-family: var(--font-sans);
    }

    * { box-sizing: border-box; }
    body { background: var(--bg); color: var(--ink); margin: 0; line-height: 1.5; -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; cursor: pointer; }
    button, input, select, textarea { font: inherit; }

    /* Header */
    .site-header { z-index: 20; border-bottom: 1px solid var(--line); background: #fffffff0; backdrop-filter: blur(16px); position: sticky; top: 0; }
    .site-header-inner { justify-content: space-between; align-items: center; gap: 18px; width: min(1500px,100%); height: 64px; margin: 0 auto; padding: 0 24px; display: flex; }
    .brand { display: flex; align-items: center; font-weight: 800; font-size: 20px; gap: 8px; }
    .brand-symbol { width: 42px; height: 42px; background: #eff4ff; border: 1.5px solid #bfd1ff; border-radius: 13px; display: flex; align-items: center; justify-content: center; color: #155eef; }
    
    .top-nav { flex: auto; justify-content: center; gap: 2px; display: flex; }
    .top-nav a { padding: 8px 10px; color: var(--muted); border-radius: 8px; font-size: 14px; font-weight: 500; }
    .top-nav a:hover, .top-nav a.is-active { background: var(--surface-muted); color: var(--ink); }
    
    .site-search-link { border: 1px solid var(--line); color: #344054; background: #fff; border-radius: 8px; align-items: center; gap: 8px; padding: 8px 10px; font-size: 14px; display: inline-flex; cursor: pointer; }

    /* Hero Section */
    .hallmark-home { width: min(1180px,100%); margin: 0 auto; padding: 32px 24px 72px; }
    .hallmark-command-head { display: grid; grid-template-columns: minmax(250px,.72fr) minmax(0,1.6fr); gap: 48px; padding: 12px 0 34px; align-items: center; }
    .hallmark-identity { display: flex; align-items: center; gap: 16px; }
    .hallmark-identity-copy h1 { margin: 0; font-size: 36px; font-weight: 800; line-height: 1.1; }
    .hallmark-identity-copy p { color: var(--muted); margin: 7px 0 0; font-size: 13px; }
    .hallmark-trust-line { display: flex; gap: 14px; margin-top: 10px; font-size: 12px; font-weight: 700; }
    .hallmark-trust-line span::before { content: "•"; color: var(--accent); margin-right: 5px; font-size: 16px; }

    .hallmark-quick-rail { border: 1px solid var(--line); background: var(--line); display: grid; grid-template-columns: repeat(5,1fr); gap: 1px; }
    .hallmark-quick-link { background: #fff; display: flex; align-items: center; gap: 10px; padding: 10px 12px; min-height: 58px; }
    .hallmark-quick-link[data-featured="true"] { border-left: 3px solid var(--accent); background: #eff4ff; grid-column: span 2; }
    .hallmark-quick-link:hover { background: #f9fafb; }
    .hallmark-quick-link span { display: grid; min-width: 0; }
    .hallmark-quick-link strong { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hallmark-quick-link small { font-size: 10.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Catalog Section */
    .hallmark-catalogue { border-top: 1px solid var(--line); display: grid; grid-template-columns: 170px 1fr; gap: 28px; padding-top: 28px; }
    .hallmark-catalogue-nav h2 { margin: 0 0 16px; font-size: 20px; }
    .hallmark-category-tabs { display: grid; gap: 7px; }
    .hallmark-category-tabs button { border: 1px solid var(--line); background: #fff; color: var(--muted); border-radius: 4px; padding: 10px 12px; font-size: 13px; font-weight: 700; text-align: left; cursor: pointer; }
    .hallmark-category-tabs button:hover, .hallmark-category-tabs button.is-active { border-color: var(--ink); color: #fff; background: var(--ink); }

    .hallmark-tool-index { border-top: 1px solid var(--line); }
    .hallmark-tool-row { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 13px; padding: 12px; border-bottom: 1px solid var(--line-dark); background: #fff; min-height: 74px; }
    .hallmark-tool-row:hover { background: #f8fafc; }
    .hallmark-row-icon { width: 38px; height: 38px; display: grid; place-items: center; border-left: 3px solid; background: #eff4ff; border-color: var(--accent); color: var(--accent); }
    .hallmark-row-copy { display: grid; gap: 2px; }
    .hallmark-row-copy strong { font-size: 14px; }
    .hallmark-row-copy span { font-size: 12px; color: var(--muted); }
    .badge-active { font-size: 10px; color: var(--accent); border: 1px solid var(--accent); border-radius: 4px; padding: 2px 4px; margin-left: 6px; display: inline-block; vertical-align: middle;}

    /* Workspace (Tool View) */
    .workspace { width: min(1120px,100%); margin: 24px auto 0; }
    .panel { background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 20px; }
    .tool-intro { text-align: center; margin-bottom: 24px; }
    .tool-intro h1 { font-size: 25px; margin: 0 0 10px; }
    .tool-intro p { color: var(--muted); font-size: 15px; margin: 0; }
    
    .btn { border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 10px 16px; font-size: 14px; font-weight: 800; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
    .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn.primary:hover { background: var(--accent-dark); }
    
    /* Inputs */
    .input-box { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 12px; font-size: 16px; outline: none; }
    .input-box:focus { border-color: var(--accent); box-shadow: 0 0 0 3px #155eef1f; }
    
    .upload-area { border: 2px dashed #cbd5e1; border-radius: 12px; padding: 40px; text-align: center; cursor: pointer; background: #f8fafc; transition: all 0.2s; }
    .upload-area:hover { border-color: var(--accent); background: #f3f7ff; }

    /* Modals */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 50; display: none; align-items: start; justify-content: center; padding-top: 10vh; }
    .modal-content { background: #fff; width: 100%; max-width: 600px; border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
    .modal-header { padding: 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px;}
    .modal-body { padding: 16px; max-height: 60vh; overflow-y: auto; }

    /* Utilities */
    .hidden { display: none !important; }
    .text-center { text-align: center; }
    .mt-4 { margin-top: 16px; }
    .mb-4 { margin-bottom: 16px; }
    .flex { display: flex; }
    .gap-4 { gap: 16px; }
    .grid { display: grid; }
    .grid-cols-3 { grid-template-columns: repeat(3, 1fr); }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="site-header-inner">
      <div class="brand" onclick="goHome()">
        <span class="brand-symbol"><i data-feather="box"></i></span>
        <span>K문서툴</span>
      </div>
      <nav class="top-nav">
        <a href="#" onclick="goHome()">전체 도구</a>
        <a href="#">문제 해결</a>
        <a href="#" onclick="filterCategory('business')">업무 문서</a>
        <a href="#" onclick="filterCategory('image')">이미지</a>
      </nav>
      <div class="site-actions">
        <button type="button" class="site-search-link" onclick="openSearch()">
          <i data-feather="search"></i>
          <span>검색</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main View (Home) -->
  <main id="home-view" class="hallmark-home">
    <section class="hallmark-command-head">
      <div class="hallmark-identity">
        <div class="brand-symbol" style="width: 66px; height: 72px; font-size: 32px;"><i data-feather="layers"></i></div>
        <div class="hallmark-identity-copy">
          <h1>K문서툴</h1>
          <p>설치 없이 쓰는 브라우저 도구 (HTML 단일 파일)</p>
          <div class="hallmark-trust-line">
            <span>무료</span><span>설치 없음</span><span>서버 전송 없음</span>
          </div>
        </div>
      </div>
      <div class="hallmark-hero-panel">
        <nav class="hallmark-quick-rail" id="quick-rail">
          <!-- JS에서 렌더링 -->
        </nav>
      </div>
    </section>

    <section class="hallmark-catalogue">
      <aside class="hallmark-catalogue-nav">
        <h2>전체 도구</h2>
        <div class="hallmark-category-tabs" id="category-tabs">
          <button class="is-active" onclick="filterCategory('all')">전체</button>
          <button onclick="filterCategory('business')">업무 문서</button>
          <button onclick="filterCategory('image')">이미지</button>
        </div>
      </aside>

      <div class="hallmark-tool-index" id="tool-list">
        <!-- JS에서 렌더링 -->
      </div>
    </section>
  </main>

  <!-- Tool View -->
  <main id="tool-view" class="workspace hidden">
    <div class="panel">
      <button class="btn mb-4" onclick="goHome()"><i data-feather="arrow-left"></i> 뒤로가기</button>
      <div class="tool-intro">
        <h1 id="tool-title">도구 제목</h1>
        <p id="tool-desc">도구 설명</p>
      </div>
      <div id="tool-container">
        <!-- JS에서 동적 도구 UI 삽입 -->
      </div>
    </div>
  </main>

  <!-- Search Modal -->
  <div id="search-modal" class="modal-overlay" onclick="closeSearch(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-header">
        <i data-feather="search" style="color:var(--muted)"></i>
        <input type="text" id="search-input" class="input-box" placeholder="어떤 작업이 필요하신가요?" style="border:none; box-shadow:none;" oninput="handleSearch()">
      </div>
      <div class="modal-body" id="search-results">
        <p class="text-center" style="color:var(--muted)">검색어를 입력하세요.</p>
      </div>
    </div>
  </div>


  <script>
    // --- 1. 도구 데이터 베이스 ---
    const toolDatabase = [
      { id: "vat-calculator", title: "부가세 계산기", category: "business", icon: "calculator", desc: "공급가액, 합계금액 10% 자동 계산", isImplemented: true },
      { id: "amount-korean", title: "금액 한글 변환기", category: "business", icon: "pen-tool", desc: "숫자 금액을 한글 표기로 변환", isImplemented: true },
      { id: "text-counter", title: "글자수 세기", category: "business", icon: "type", desc: "공백 포함/제외, 문서 바이트 계산기", isImplemented: true },
      { id: "stamp-background", title: "도장 배경 제거", category: "business", icon: "aperture", desc: "스캔 도장 투명 PNG 만들기", isImplemented: true },
      { id: "image-resizer", title: "이미지 리사이즈", category: "image", icon: "maximize", desc: "가로/세로 픽셀 크기 조절", isImplemented: true },
      { id: "image-converter", title: "이미지 포맷 변환", category: "image", icon: "refresh-cw", desc: "WebP, PNG, JPG 포맷 변경", isImplemented: true },
      { id: "image-base64", title: "이미지 Base64 변환기", category: "image", icon: "code", desc: "이미지를 문자열(Data URI)로 변환", isImplemented: true },
      
      // 비구현 껍데기들
      { id: "business-nameplate", title: "사업자 명판 만들기", category: "business", icon: "file-text", desc: "사업자 명판 도장 합성 이미지 생성" },
      { id: "transaction-statement", title: "거래명세서 자동작성", category: "business", icon: "file-text", desc: "무료 양식 작성 및 PDF 저장" },
      { id: "pdf-split", title: "PDF 나누기", category: "pdf", icon: "file", desc: "PDF 분할 및 페이지별 저장" },
      { id: "video-to-gif", title: "동영상 GIF 변환", category: "image", icon: "video", desc: "MP4 등을 움짤로 만들기" }
    ];

    let currentCategory = 'all';

    // --- 2. 렌더링 함수 ---
    function renderHome() {
      const listEl = document.getElementById('tool-list');
      const railEl = document.getElementById('quick-rail');
      
      // 상단 빠른 링크 (구현된 툴 4개)
      const implTools = toolDatabase.filter(t => t.isImplemented).slice(0, 4);
      railEl.innerHTML = implTools.map((t, idx) => `
        <a class="hallmark-quick-link" data-featured="${idx === 0}" href="#" onclick="openTool('${t.id}')">
          <i data-feather="${t.icon}"></i>
          <span>
            ${idx === 0 ? '<em>대표 도구</em>' : ''}
            <strong>${t.title}</strong>
            <small>${t.desc}</small>
          </span>
        </a>
      `).join('');

      // 메인 리스트
      const filtered = toolDatabase.filter(t => currentCategory === 'all' || t.category === currentCategory);
      listEl.innerHTML = filtered.map(t => `
        <a class="hallmark-tool-row" href="#" onclick="openTool('${t.id}')">
          <span class="hallmark-row-icon"><i data-feather="${t.icon}"></i></span>
          <span class="hallmark-row-copy">
            <strong>${t.title} ${t.isImplemented ? '<span class="badge-active">작동</span>' : ''}</strong>
            <span>${t.desc}</span>
          </span>
          <i data-feather="chevron-right" style="color:var(--muted)"></i>
        </a>
      `).join('');

      feather.replace(); // 아이콘 렌더링
    }

    function filterCategory(cat) {
      currentCategory = cat;
      const tabs = document.getElementById('category-tabs').children;
      Array.from(tabs).forEach(tab => tab.classList.remove('is-active'));
      event.target.classList.add('is-active');
      renderHome();
    }

    function goHome() {
      document.getElementById('home-view').classList.remove('hidden');
      document.getElementById('tool-view').classList.add('hidden');
    }

    // --- 3. 검색 기능 ---
    function openSearch() {
      document.getElementById('search-modal').style.display = 'flex';
      document.getElementById('search-input').focus();
    }
    
    function closeSearch(e) {
      document.getElementById('search-modal').style.display = 'none';
      document.getElementById('search-input').value = '';
      handleSearch();
    }

    function handleSearch() {
      const q = document.getElementById('search-input').value.toLowerCase();
      const resEl = document.getElementById('search-results');
      if (!q) { resEl.innerHTML = '<p class="text-center" style="color:var(--muted)">검색어를 입력하세요.</p>'; return; }
      
      const res = toolDatabase.filter(t => t.title.toLowerCase().includes(q) || t.desc.toLowerCase().includes(q));
      if (res.length === 0) { resEl.innerHTML = '<p class="text-center" style="color:var(--muted)">결과가 없습니다.</p>'; return; }

      resEl.innerHTML = res.map(t => `
        <a href="#" onclick="openTool('${t.id}'); closeSearch();" style="display:flex; justify-content:space-between; padding:12px; border-bottom:1px solid var(--line); align-items:center;">
          <div><strong style="display:block">${t.title}</strong><span style="font-size:12px; color:var(--muted)">${t.desc}</span></div>
        </a>
      `).join('');
    }

    // --- 4. 개별 도구 실행기 ---
    function openTool(id) {
      const tool = toolDatabase.find(t => t.id === id);
      if(!tool) return;

      document.getElementById('home-view').classList.add('hidden');
      document.getElementById('tool-view').classList.remove('hidden');
      document.getElementById('tool-title').innerText = tool.title;
      document.getElementById('tool-desc').innerText = tool.desc;
      
      const container = document.getElementById('tool-container');
      
      if (!tool.isImplemented) {
        container.innerHTML = `
          <div style="text-align:center; padding:40px; background:#f8fafc; border-radius:12px; border:1px solid var(--line)">
            <i data-feather="archive" style="width:48px; height:48px; color:var(--muted); margin-bottom:16px;"></i>
            <h3 style="margin-bottom:8px;">단일 HTML 한계 안내</h3>
            <p style="color:var(--muted); font-size:14px;">이 기능(PDF/영상 조작 등)은 무거운 외부 라이브러리(WASM 등)가 필요하여 HTML 단일 파일 구성에서는 제외되었습니다.<br/>'도장 배경 제거' 등 "작동" 뱃지가 있는 기능을 테스트해 보세요.</p>
          </div>
        `;
        feather.replace();
        return;
      }

      // 동적 UI 생성기
      container.innerHTML = ''; 
      
      if (id === 'vat-calculator') {
        container.innerHTML = `
          <div>
            <div class="flex gap-4 mb-4">
              <label><input type="radio" name="vatType" value="supply" checked onchange="calcVat()"> 공급가액 입력</label>
              <label><input type="radio" name="vatType" value="total" onchange="calcVat()"> 합계금액 입력</label>
            </div>
            <input type="text" id="vat-input" class="input-box mb-4" placeholder="숫자만 입력하세요" oninput="calcVat()" style="font-size:24px; font-weight:bold;">
            <div style="background:#f8fafc; padding:20px; border-radius:12px; line-height:2;">
              <div style="display:flex; justify-content:space-between"><span>공급가액</span><strong id="vat-res-supply">0 원</strong></div>
              <div style="display:flex; justify-content:space-between"><span>부가세 (10%)</span><strong id="vat-res-vat">0 원</strong></div>
              <hr style="border-top:1px solid var(--line); margin:12px 0;">
              <div style="display:flex; justify-content:space-between; color:var(--accent); font-size:18px;"><strong>합계금액</strong><strong id="vat-res-total">0 원</strong></div>
            </div>
          </div>
        `;
        window.calcVat = function() {
          const raw = document.getElementById('vat-input').value.replace(/[^0-9]/g, '');
          document.getElementById('vat-input').value = raw ? parseInt(raw).toLocaleString() : '';
          const num = parseInt(raw) || 0;
          const type = document.querySelector('input[name="vatType"]:checked').value;
          
          let supply = 0, vat = 0, total = 0;
          if (type === 'supply') { supply = num; vat = Math.floor(num * 0.1); total = supply + vat; } 
          else { supply = Math.round(num / 1.1); vat = num - supply; total = num; }

          document.getElementById('vat-res-supply').innerText = supply.toLocaleString() + ' 원';
          document.getElementById('vat-res-vat').innerText = vat.toLocaleString() + ' 원';
          document.getElementById('vat-res-total').innerText = total.toLocaleString() + ' 원';
        }
      }

      else if (id === 'amount-korean') {
        container.innerHTML = `
          <div class="text-center">
            <input type="text" id="kor-input" class="input-box mb-4" placeholder="숫자를 입력하세요 (예: 1500000)" oninput="calcKor()" style="font-size:24px; text-align:center;">
            <div id="kor-res" style="font-size:28px; font-weight:800; min-height:50px; margin-bottom:20px;"></div>
            <button class="btn primary" onclick="copyText('kor-res')"><i data-feather="copy"></i> 한글 금액 복사하기</button>
          </div>
        `;
        window.calcKor = function() {
          const raw = document.getElementById('kor-input').value.replace(/[^0-9]/g, '');
          document.getElementById('kor-input').value = raw ? parseInt(raw).toLocaleString() : '';
          
          const numFormat = ["", "일", "이", "삼", "사", "오", "육", "칠", "팔", "구"];
          const danFormat = ["", "십", "백", "천"];
          const manFormat = ["", "만", "억", "조", "경"];
          let res = "";
          for (let i = 0; i < raw.length; i++) {
            let n = parseInt(raw.charAt(raw.length - 1 - i));
            if (n !== 0) res = numFormat[n] + danFormat[i % 4] + res;
            if (i % 4 === 0 && i !== 0 && res.length > 0) res = manFormat[i / 4] + res;
          }
          document.getElementById('kor-res').innerText = res ? '일금 ' + res + '원정' : '';
        }
      }

      else if (id === 'text-counter') {
        container.innerHTML = `
          <div>
            <div class="grid grid-cols-3 gap-4 mb-4 text-center">
              <div style="border:1px solid var(--line); border-radius:8px; padding:16px;">
                <div style="font-size:12px; color:var(--muted)">공백 포함</div><strong id="tc-1" style="font-size:24px; color:var(--accent)">0자</strong>
              </div>
              <div style="border:1px solid var(--line); border-radius:8px; padding:16px;">
                <div style="font-size:12px; color:var(--muted)">공백 제외</div><strong id="tc-2" style="font-size:24px; color:var(--accent)">0자</strong>
              </div>
              <div style="border:1px solid var(--line); border-radius:8px; padding:16px;">
                <div style="font-size:12px; color:var(--muted)">EUC-KR 바이트</div><strong id="tc-3" style="font-size:24px;">0B</strong>
              </div>
            </div>
            <textarea id="tc-input" class="input-box" style="height:200px" placeholder="내용을 입력하세요..." oninput="calcText()"></textarea>
          </div>
        `;
        window.calcText = function() {
          const txt = document.getElementById('tc-input').value;
          document.getElementById('tc-1').innerText = txt.length.toLocaleString() + '자';
          document.getElementById('tc-2').innerText = txt.replace(/\s/g, '').length.toLocaleString() + '자';
          
          let bytes = 0;
          for(let i=0; i<txt.length; i++) bytes += txt.charCodeAt(i) > 128 ? 2 : 1;
          document.getElementById('tc-3').innerText = bytes.toLocaleString() + 'B';
        }
      }

      else if (id === 'stamp-background') {
        container.innerHTML = `
          <div class="text-center">
            <label id="sb-upload-area" class="upload-area" style="display:block">
              <input type="file" accept="image/*" class="hidden" onchange="handleStamp(event)">
              <i data-feather="upload-cloud" style="width:48px;height:48px;color:var(--accent);margin:0 auto 16px;"></i>
              <strong>도장 이미지 업로드</strong><br><small style="color:var(--muted)">흰 종이에 찍힌 도장 이미지를 올리세요</small>
            </label>
            <div id="sb-editor" class="hidden">
              <label>배경 제거 강도 (조절해보세요): <input type="range" id="sb-thresh" min="100" max="250" value="200" oninput="processStamp()" style="width:100%; margin:10px 0"></label>
              <div style="background:url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAMUlEQVQ4T2NkYGAQYcAP3uCTZhw1gGGYhAGBZIA/nY4aiIEZRg2gGA5+I0iPj6MGMDKPBAANgws1G8fE1wAAAABJRU5ErkJggg=='); border:1px solid var(--line); border-radius:8px; padding:10px; margin-bottom:16px;">
                <canvas id="sb-canvas" style="max-width:100%; max-height:250px;"></canvas>
              </div>
              <button class="btn primary" onclick="downloadCanvas('sb-canvas', 'transparent_stamp.png')"><i data-feather="download"></i> 투명 PNG 저장</button>
            </div>
          </div>
        `;
        let stampImg = null;
        window.handleStamp = function(e) {
          const file = e.target.files[0];
          if(!file) return;
          const reader = new FileReader();
          reader.onload = (ev) => {
            stampImg = new Image();
            stampImg.onload = () => {
              document.getElementById('sb-upload-area').classList.add('hidden');
              document.getElementById('sb-editor').classList.remove('hidden');
              processStamp();
            };
            stampImg.src = ev.target.result;
          };
          reader.readAsDataURL(file);
        }
        window.processStamp = function() {
          if(!stampImg) return;
          const canvas = document.getElementById('sb-canvas');
          const ctx = canvas.getContext('2d');
          canvas.width = stampImg.width; canvas.height = stampImg.height;
          ctx.drawImage(stampImg, 0, 0);
          
          const thresh = parseInt(document.getElementById('sb-thresh').value);
          const imgData = ctx.getImageData(0,0, canvas.width, canvas.height);
          const data = imgData.data;
          
          for(let i=0; i<data.length; i+=4) {
            const avg = (data[i] + data[i+1] + data[i+2]) / 3;
            if(avg > thresh) data[i+3] = 0; // 알파채널 투명화
          }
          ctx.putImageData(imgData, 0, 0);
        }
      }

      else if (id === 'image-resizer') {
        container.innerHTML = `
          <div class="text-center">
            <label id="ir-upload-area" class="upload-area" style="display:block">
              <input type="file" accept="image/*" class="hidden" onchange="handleResizeUpload(event)">
              <i data-feather="image" style="width:48px;height:48px;color:var(--accent);margin:0 auto 16px;"></i>
              <strong>리사이즈 할 이미지 업로드</strong>
            </label>
            <div id="ir-editor" class="hidden">
              <div class="flex" style="justify-content:center; align-items:center; gap:10px; margin-bottom:16px;">
                <label>가로<br><input type="number" id="ir-w" class="input-box" style="width:100px; text-align:center" oninput="changeResize('w')"></label>
                <span style="padding-top:20px; color:var(--muted)">X</span>
                <label>세로<br><input type="number" id="ir-h" class="input-box" style="width:100px; text-align:center" oninput="changeResize('h')"></label>
              </div>
              <canvas id="ir-canvas" class="hidden"></canvas>
              <img id="ir-preview" style="max-width:100%; max-height:200px; border:1px solid var(--line); border-radius:8px; margin-bottom:16px; opacity:0.5;">
              <br><button class="btn primary" onclick="downloadResized()"><i data-feather="download"></i> 리사이즈 이미지 저장</button>
            </div>
          </div>
        `;
        let resizeImg = null;
        window.handleResizeUpload = function(e) {
          const file = e.target.files[0];
          if(!file) return;
          const reader = new FileReader();
          reader.onload = (ev) => {
            resizeImg = new Image();
            resizeImg.onload = () => {
              document.getElementById('ir-upload-area').classList.add('hidden');
              document.getElementById('ir-editor').classList.remove('hidden');
              document.getElementById('ir-w').value = resizeImg.width;
              document.getElementById('ir-h').value = resizeImg.height;
              document.getElementById('ir-preview').src = resizeImg.src;
            };
            resizeImg.src = ev.target.result;
          };
          reader.readAsDataURL(file);
        }
        window.changeResize = function(type) {
          if(!resizeImg) return;
          const wEl = document.getElementById('ir-w');
          const hEl = document.getElementById('ir-h');
          if(type === 'w') hEl.value = Math.round((wEl.value / resizeImg.width) * resizeImg.height);
          else wEl.value = Math.round((hEl.value / resizeImg.height) * resizeImg.width);
        }
        window.downloadResized = function() {
          const canvas = document.getElementById('ir-canvas');
          canvas.width = document.getElementById('ir-w').value;
          canvas.height = document.getElementById('ir-h').value;
          canvas.getContext('2d').drawImage(resizeImg, 0, 0, canvas.width, canvas.height);
          downloadCanvas('ir-canvas', 'resized.jpg', 'image/jpeg');
        }
      }

      else if (id === 'image-converter') {
        container.innerHTML = `
          <div class="text-center">
            <label id="ic-upload-area" class="upload-area" style="display:block">
              <input type="file" accept="image/*" class="hidden" onchange="handleConvertUpload(event)">
              <i data-feather="refresh-cw" style="width:48px;height:48px;color:var(--accent);margin:0 auto 16px;"></i>
              <strong>포맷을 변경할 이미지 업로드</strong>
            </label>
            <div id="ic-editor" class="hidden">
              <img id="ic-preview" style="max-width:100%; max-height:200px; border:1px solid var(--line); border-radius:8px; margin-bottom:16px;">
              <canvas id="ic-canvas" class="hidden"></canvas>
              <div style="max-width:200px; margin:0 auto 16px;">
                <select id="ic-format" class="input-box">
                  <option value="image/png">PNG 로 변환</option>
                  <option value="image/jpeg">JPG 로 변환</option>
                  <option value="image/webp">WebP 로 변환</option>
                </select>
              </div>
              <button class="btn primary" onclick="downloadConverted()"><i data-feather="download"></i> 다운로드</button>
            </div>
          </div>
        `;
        let convertImg = null;
        window.handleConvertUpload = function(e) {
          const file = e.target.files[0];
          if(!file) return;
          const reader = new FileReader();
          reader.onload = (ev) => {
            convertImg = new Image();
            convertImg.onload = () => {
              document.getElementById('ic-upload-area').classList.add('hidden');
              document.getElementById('ic-editor').classList.remove('hidden');
              document.getElementById('ic-preview').src = convertImg.src;
              
              const cvs = document.getElementById('ic-canvas');
              cvs.width = convertImg.width; cvs.height = convertImg.height;
              cvs.getContext('2d').drawImage(convertImg, 0, 0);
            };
            convertImg.src = ev.target.result;
          };
          reader.readAsDataURL(file);
        }
        window.downloadConverted = function() {
          const format = document.getElementById('ic-format').value;
          const ext = format.split('/')[1] === 'jpeg' ? 'jpg' : format.split('/')[1];
          downloadCanvas('ic-canvas', 'converted.' + ext, format);
        }
      }

      else if (id === 'image-base64') {
        container.innerHTML = `
          <div class="text-center">
            <label class="upload-area" style="display:block">
              <input type="file" accept="image/*" class="hidden" onchange="handleB64(event)">
              <i data-feather="code" style="width:48px;height:48px;color:var(--accent);margin:0 auto 16px;"></i>
              <strong>이미지 선택</strong>
            </label>
            <textarea id="b64-res" class="input-box hidden mt-4" style="font-family:monospace; font-size:12px; height:150px;" readonly></textarea>
            <button id="b64-btn" class="btn primary hidden mt-4" onclick="copyText('b64-res')"><i data-feather="copy"></i> Base64 복사</button>
          </div>
        `;
        window.handleB64 = function(e) {
          const file = e.target.files[0];
          if(!file) return;
          const reader = new FileReader();
          reader.onload = (ev) => {
            document.getElementById('b64-res').value = ev.target.result;
            document.getElementById('b64-res').classList.remove('hidden');
            document.getElementById('b64-btn').classList.remove('hidden');
          };
          reader.readAsDataURL(file);
        }
      }

      feather.replace();
    }

    // --- 공통 유틸리티 ---
    window.copyText = function(id) {
      const text = id === 'kor-res' ? document.getElementById(id).innerText : document.getElementById(id).value;
      if(!text) return;
      navigator.clipboard.writeText(text).then(() => alert('복사되었습니다.'));
    }

    window.downloadCanvas = function(canvasId, filename, mime = 'image/png') {
      const canvas = document.getElementById(canvasId);
      const a = document.createElement('a');
      a.href = canvas.toDataURL(mime, 0.9);
      a.download = filename;
      a.click();
    }

    // 초기화
    renderHome();
  </script>
</body>
</html>
